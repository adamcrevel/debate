[project]
name = "debate"
version = "0.1.0"
description = "A structured, evidence-grounded debate engine driven by the omp CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
debate = "debate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
